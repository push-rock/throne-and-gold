<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>王座与黄金 · Throne &amp; Gold DEMO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#171210;color:#e8dcc0;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#241b14;border-bottom:2px solid #5a4426;flex-wrap:wrap}
#top .spacer{flex:1}
.chip{background:#2f251b;border:1px solid #5a4426;border-radius:6px;padding:3px 10px;white-space:nowrap}
.chip b{color:#f0c96a}
.chip.mainRes{border-color:#c9a24b;box-shadow:0 0 8px rgba(201,162,75,.35)}
.chip .rate{color:#8fd18f;font-size:12px}
.chip .rate.neg{color:#e08a7a}
button{cursor:pointer;background:#3a2d1e;color:#f0e6cc;border:1px solid #7a5c2e;border-radius:6px;padding:4px 10px;font-size:13px}
button:hover{background:#4d3b26}
button:disabled{opacity:.45;cursor:not-allowed}
button.goldbtn{border-color:#c9a24b;color:#f5d98c;background:#4a381a}
button.goldbtn:hover{background:#5d4722}
button.danger{border-color:#a04a3a;color:#f0a08a}
.small{font-size:12px;color:#a89877}
/* ---------- 三栏 ---------- */
#wrap{flex:1;display:flex;min-height:0}
#left{width:270px;overflow-y:auto;padding:8px;background:#1d1712;border-right:1px solid #3a2c1c}
#center{flex:1;min-width:0;position:relative;background:#14100c}
#map{width:100%;height:100%;display:block}
#right{width:320px;overflow-y:auto;padding:8px;background:#1d1712;border-left:1px solid #3a2c1c}
/* ---------- 左栏卡片 ---------- */
.card{background:#251d15;border:1px solid #4a3a22;border-radius:8px;padding:8px;margin-bottom:8px}
.card h3{font-size:13px;color:#f0c96a;border-bottom:1px solid #4a3a22;padding-bottom:4px;margin-bottom:6px}
.bar{height:8px;background:#0d0a07;border:1px solid #4a3a22;border-radius:4px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:#c9a24b}
.bar.hp i{background:#b8503f}
.bar.good i{background:#7ab55c}
.bar.chaos i{background:#a05aa0}
details{background:#251d15;border:1px solid #4a3a22;border-radius:8px;margin-bottom:8px}
details summary{cursor:pointer;padding:7px 10px;font-size:13px;color:#f0c96a;list-style:none}
details summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
details .body{padding:4px 10px 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0}
.tag{display:inline-block;background:#33291c;border:1px solid #5a4426;border-radius:4px;padding:0 6px;font-size:12px;margin:1px}
/* ---------- 地图 ---------- */
.node{cursor:pointer}
.node circle{fill:#2f251b;stroke:#7a5c2e;stroke-width:2}
.node.locked circle{fill:#1a1512;stroke:#3a3128;stroke-dasharray:4 3}
.node.locked{opacity:.35}
.node.mine circle{stroke:#c9a24b;stroke-width:3}
.node text{fill:#e8dcc0;font-size:12px;text-anchor:middle;pointer-events:none}
.node .ico{font-size:18px;pointer-events:none}
.node.locked text{fill:#5a5044}
.node.act circle{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{stroke-width:2}50%{stroke-width:5}}
.edge{stroke:#4a3a22;stroke-width:1.5;stroke-dasharray:6 4}
.occupied{fill:#c9a24b !important}
/* ---------- 日志 ---------- */
#logbox{font-size:12.5px}
#logbox .entry{padding:3px 0;border-bottom:1px dashed #33291c}
#logbox .d{color:#8a7a5a;margin-right:4px}
#logbox .good{color:#9fd597}
#logbox .bad{color:#e0937a}
#logbox .epic{color:#f0c96a;font-weight:bold}
/* ---------- 底栏事件卡 ---------- */
#bottom{min-height:110px;padding:8px 12px;background:#241b14;border-top:2px solid #5a4426;display:flex;gap:14px;align-items:stretch;overflow-x:auto}
.bsec{display:flex;flex-direction:column;gap:6px;min-width:280px}
.bsec-t{font-size:12px;color:#c9a24b;letter-spacing:1px;border-bottom:1px solid #4a3a22;padding-bottom:3px;white-space:nowrap}
.bsec-cards{display:flex;gap:10px;align-items:center;flex:1}
.evcard{min-width:200px;max-width:250px;background:#2f2114;border:2px solid #b58a3a;border-radius:8px;padding:10px;cursor:pointer;position:relative;animation:evpulse 1.6s infinite}
.evcard:hover{background:#3b2b18;border-color:#f0c96a}
@keyframes evpulse{0%,100%{box-shadow:0 0 0 rgba(201,162,75,0)}50%{box-shadow:0 0 10px rgba(201,162,75,.55)}}
.evcard .t{color:#f0c96a;font-weight:bold;font-size:15px}
.evcard .dl{display:inline-block;background:#4a221a;color:#f0a08a;border-radius:4px;padding:0 7px;font-weight:bold;font-size:13px;margin-top:6px}
.evcard .cta{font-size:12px;color:#c9a24b;border-top:1px dashed #5a4426;margin-top:8px;padding-top:4px;text-align:center}
.actchip{background:#2a231b;border:1px solid #4a3a22;color:#b8a988;border-radius:6px;padding:3px 10px;white-space:nowrap;font-size:13px}
.hint{color:#a89877;font-size:13px;padding:0 10px}
/* ---------- 信息层级 ---------- */
.chip{font-size:13px}
.chip b{font-size:16px;color:#f5d98c}
.chip.mainRes b{font-size:17px}
#modalbox .story{color:#a8987a;font-size:13px;font-style:italic}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;line-height:1.4;font-size:15px;font-weight:600;color:#f0e6cc}
.opt .meta{display:flex;flex-wrap:wrap;gap:5px;font-size:12px;font-weight:400;margin-top:4px}
.meta .tag-ok{background:#1d3220;color:#9fd597;border-radius:4px;padding:0 6px}
.meta .tag-bad{background:#3a1f1a;color:#f0a08a;border-radius:4px;padding:0 6px}
.meta .tag-dc{background:#3a2d14;color:#e0b05a;border-radius:4px;padding:0 6px}
.ledger-net{font-size:19px;font-weight:bold;line-height:1.2;margin:2px 0 6px}
/* ---------- 当日进度条 ---------- */
.dayprog{width:150px;height:10px;background:#0d0a07;border:1px solid #5a4426;border-radius:5px;overflow:hidden;flex:none;position:relative}
.dayprog i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7a5c2e,#f0c96a);transition:width .09s linear}
.dayprog.paused i{background:#4a4237}
.dayprog .dplabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#d8cba8;letter-spacing:1px;pointer-events:none}
.bigsteps{margin:10px 0}
.bigsteps .st{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid #4a3a22;border-radius:8px;margin:6px 0;background:#2a2118}
.bigsteps .st .ic{font-size:24px}
.bigsteps .st b{color:#f0c96a;font-size:14px}
.bigsteps .st .d{color:#a89877;font-size:12px}
/* ---------- 掷骰剧场 ---------- */
#dicetheater{position:fixed;top:15%;left:50%;transform:translateX(-50%);z-index:120;
 background:rgba(18,12,6,.96);border:2px solid #b58a3a;border-radius:12px;padding:12px 28px;
 text-align:center;min-width:280px;max-width:400px;box-shadow:0 0 30px rgba(0,0,0,.7);cursor:pointer;animation:fadein .25s}
#dicetheater.off{display:none}
#dicetheater .dt-name{color:#c9a24b;font-size:12.5px;letter-spacing:2px}
#dicetheater .dt-die{font-size:46px;font-weight:bold;color:#f0e6cc;line-height:1.05;margin:4px 0;font-family:Georgia,serif}
#dicetheater .dt-die.dt-set{animation:dtpop .35s}
@keyframes dtpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.3)}100%{transform:scale(1)}}
#dicetheater .dt-sub{color:#a89877;font-size:12px}
#dicetheater .dt-math{font-size:16px;color:#e8dcc0;margin:2px 0}
#dicetheater .dt-math b{color:#f0c96a;font-size:18px}
#dicetheater .dt-verdict{font-size:22px;font-weight:bold;margin:3px 0;animation:dtpop .3s}
#dicetheater .dt-crit{color:#f0c96a;text-shadow:0 0 14px rgba(240,201,106,.7)}
#dicetheater .dt-success{color:#9fd597}
#dicetheater .dt-fail{color:#e0a05a}
#dicetheater .dt-critfail{color:#e08a7a}
#dicetheater .dt-parts{color:#8a7a5a;font-size:11.5px;line-height:1.6;max-width:360px;margin-top:2px}
/* ---------- 弹窗 ---------- */
#modal{position:fixed;inset:0;background:rgba(8,5,3,.72);display:flex;align-items:center;justify-content:center;z-index:50}
#modal.off{display:none}
#modalbox{background:#251d15;border:2px solid #c9a24b;border-radius:12px;max-width:640px;width:92%;max-height:86vh;overflow-y:auto;padding:18px 20px;box-shadow:0 0 40px rgba(201,162,75,.25)}
#modalbox h2{color:#f0c96a;font-size:17px;margin-bottom:8px}
#modalbox .story{color:#a8987a;font-size:13px;font-style:italic;margin-bottom:12px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;line-height:1.4;font-size:15px;font-weight:600;color:#f0e6cc}
.opt .meta{display:flex;flex-wrap:wrap;gap:5px;font-size:12px;font-weight:400;margin-top:4px}
.opt .dc{color:#e0a05a}
.opt .risk{color:#e07a5a}
hr{border:none;border-top:1px solid #4a3a22;margin:10px 0}
/* ---------- 横幅提示 ---------- */
#banner{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#4a381a;border:1px solid #f0c96a;color:#f5d98c;padding:10px 18px;border-radius:8px;z-index:60;box-shadow:0 0 24px rgba(201,162,75,.4);display:none;max-width:80%;text-align:center}
#banner.on{display:block;animation:fadein .4s}
@keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1}}
/* ---------- 新手引导 ---------- */
#tutbar{display:none;align-items:center;gap:12px;padding:5px 14px;background:#2c2113;border-bottom:1px solid #c9a24b;font-size:13px;color:#f0e6cc}
#tutbar b{color:#f0c96a}
#tutbar button{margin-left:auto;font-size:12px;padding:2px 8px}
.tut-hi{animation:tuthi 1.4s infinite}
@keyframes tuthi{0%,100%{box-shadow:0 0 0 rgba(240,201,106,0)}50%{box-shadow:0 0 12px 3px rgba(240,201,106,.75)}}
g.tut-hi circle{stroke:#f0c96a !important;stroke-width:4;animation:pulse 1.2s infinite}
/* ---------- 资源飘字 ---------- */
.floaty{position:fixed;font-weight:bold;font-size:17px;pointer-events:none;z-index:99;
 animation:floaty 1.8s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
.floaty.gold{color:#f5d98c}
.floaty.infl{color:#9fd5ff}
.floaty.hp{color:#e07a5a}
.floaty.small{font-size:13px}
@keyframes floaty{0%{opacity:0;transform:translateY(6px)}12%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
/* ---------- 资源条闪动 ---------- */
.chip.flash{animation:chipflash .8s}
@keyframes chipflash{0%,100%{background:#2f251b}35%{background:#5d4722;box-shadow:0 0 12px rgba(240,201,106,.8)}}
/* ---------- 开局向导 ---------- */
#create{position:fixed;inset:0;background:radial-gradient(ellipse at center,#2a2013 0%,#100c08 75%);z-index:80;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center}
#create.off{display:none}
#create .wiz{max-width:620px;width:94%;margin:40px auto;padding:24px;background:#251d15;border:2px solid #c9a24b;border-radius:12px}
#create h1{color:#f0c96a;text-align:center;font-size:24px;letter-spacing:4px;margin-bottom:2px}
#create .sub{text-align:center;color:#a89877;margin-bottom:18px}
#create h2{color:#f0c96a;font-size:15px;margin:14px 0 8px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick .p{flex:1 1 170px;background:#2f251b;border:1px solid #5a4426;border-radius:8px;padding:8px 10px;cursor:pointer}
.pick .p:hover{border-color:#c9a24b;background:#3b2e1d}
.pick .p.sel{border-color:#f0c96a;box-shadow:0 0 10px rgba(201,162,75,.4)}
.pick .p b{color:#f0c96a}
.pick .p .d{font-size:12px;color:#a89877}
input[type=text]{background:#1a1512;border:1px solid #5a4426;color:#f0e6cc;border-radius:6px;padding:6px 10px;font-size:14px;width:200px}
input[type=range]{width:130px;accent-color:#c9a24b}
.wizbtns{display:flex;justify-content:space-between;margin-top:20px}
.endstats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.endstats .chip{flex:1}
</style>
</head>
<body>

    <div id="right"><div id="logbox"></div></div>
  </div>

</div>
<div id="banner"></div>

<script>

const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
let _rs=1;
function rngSeed(s){_rs=s>>>0||1}
function rng(){_rs|=0;_rs=_rs+0x6D2B79F5|0;let t=Math.imul(_rs^_rs>>>15,1|_rs);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function ri(a,b){return a+Math.floor(rng()*(b-a+1))}
function d20(){return ri(1,20)}
function fmt(n){n=Math.floor(n);if(!isFinite(n))n=0;return n.toLocaleString("zh-CN")}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* ---------- 判定透明化：每个修正都有名有姓 ---------- */
function skillBreakdown(skill){const parts=[];
 if(!skill)return parts;
 const r=RACES[S.race],c=CLASSES[S.cls];
 if(r.skills&&r.skills[skill])parts.push({n:"种族·"+r.name,v:r.skills[skill]});
 if(c.skills&&c.skills[skill])parts.push({n:"职业·"+c.name,v:c.skills[skill]});
 const al=ALIGN[S.align];if(al.skills&&al.skills[skill])parts.push({n:"阵营·"+al.name,v:al.skills[skill]});
 for(const g of S.gear){const it=GEAR[g];if(!it)continue;
  if(it.skill===skill&&it.bonus)parts.push({n:"装备·"+it.name,v:it.bonus});
  if(it.lore&&skill==="lore")parts.push({n:"装备·"+it.name,v:it.lore})}
 for(const cp of S.comps){const cc=COMP[cp];if(cc&&cc.skills&&cc.skills[skill])parts.push({n:"同伴·"+cc.name,v:cc.skills[skill]})}
 if(S.flags.vet_tip&&skill==="martial")parts.push({n:"老兵的指点",v:1});
 if(S.policies&&S.policies.guild==="intel"&&(skill==="lore"||skill==="stealth"))parts.push({n:"政策·情报行会",v:1});
 if(S.assets.includes("intel_net"))parts.push({n:"产业·情报网",v:1});
 if(S.hp<=Math.ceil(S.hpMax/3))parts.push({n:"重伤拖累",v:-1});
 return parts}
function skillBonus(skill){if(!skill)return 0;
 return skillBreakdown(skill).reduce((a,p)=>a+p.v,0)}
/* 下一次判定的期望成功率（含待发的一次性奖励与半身人幸运） */
function rollOdds(skill,dc,extra){
 const mods=(skill?skillBonus(skill):0)+(extra||0)+(RACES[S.race].roll||0)+(S.flags.tip?1:0)+(S.flags.inspire?2:0);
 const lucky=!!RACES[S.race].lucky;
 const win=d=>d===20||(d!==1&&d+mods>=dc);
 let ok=0;
 for(let d=1;d<=20;d++){
  if(d===1&&lucky){for(let e=1;e<=20;e++)if(win(e))ok+=.05}
  else if(win(d))ok++}
 return{mods,pct:Math.round(ok/20*100),need:Math.max(2,dc-mods),critAt:Math.max(2,dc+5-mods)}}
function rollCheck(skill,dc,extra){
 const odds=rollOdds(skill,dc,extra);
 let mods=(skill?skillBonus(skill):0)+(extra||0)+(RACES[S.race].roll||0);
 const parts=skill?skillBreakdown(skill).map(p=>({...p})):[];
 if(extra)parts.push({n:"形势",v:extra});
 if(RACES[S.race].roll)parts.push({n:"种族·"+RACES[S.race].name+"的掷骰天赋",v:RACES[S.race].roll});
 if(S.flags.tip){mods+=1;delete S.flags.tip;parts.push({n:"小乞丐的情报(一次性)",v:1});log("🎲 小乞丐的情报灵验了(+1)。")}
 if(S.flags.inspire){mods+=2;delete S.flags.inspire;parts.push({n:"激励骰(一次性)",v:2});log("✨ 激励骰生效：+2。")}
 let r=d20(),reroll=0;
 if(RACES[S.race].lucky&&r===1){const r2=d20();log(`🎲 半身人幸运：把 1 重掷成 ${r2}`);reroll=r2;r=r2}
 const total=r+mods;let out;
 if(r===20)out="crit";else if(r===1)out="critfail";
 else if(total>=dc+5)out="crit";else if(total>=dc)out="success";
 else if(total<=dc-5)out="critfail";else out="fail";
 S.stats.rolls++;if(out==="crit"){S.stats.crits++;S._cf=0}
 if(out==="critfail"&&S.flags.lucky_coin){delete S.flags.lucky_coin;
  out="fail";log("🪙 幸运币碎裂了——命运松了口。大失败降格为失败。")}
 if(out==="critfail"){S.stats.fails++;S._cf=(S._cf||0)+1;
  if(S._cf>=2){S.flags.inspire=true;S._cf=0;log("✨ 连续的挫折教会了你什么。获得激励骰(下次+2)。","epic")}}
 log(`🎲 [${skill?SK_LBL[skill]:"运气"}] ${r}${mods?sgn(mods):""} = ${total} vs DC${dc} → ${OUT_NAME[out]}`,
  out==="crit"?"epic":out==="critfail"?"bad":"");
 diceTheater({skill,dc,mods,parts,r,reroll,total,out,odds});
 return out}
/* ---------- 掷骰剧场：把每一次判定演出来 ---------- */
const DT_CLS={crit:"dt-crit",success:"dt-success",fail:"dt-fail",critfail:"dt-critfail"};
let _dq=[],_dOn=false,_dT=[],_dSpin=null;
function _dtClear(){if(_dSpin){clearInterval(_dSpin);_dSpin=null}
 for(const t of _dT)clearTimeout(t);_dT=[]}
function diceTheater(info){_dq.push(info);if(_dq.length>3)_dq=_dq.slice(-3);
 if(!_dOn)_dNextRoll()}
function _dNextRoll(){
 const info=_dq.shift(),el=$("dicetheater");
 if(!info||!el){_dOn=false;if(el)el.classList.add("off");return}
 _dOn=true;_dtClear();el.classList.remove("off");
 el.onclick=()=>{_dtClear();el.classList.add("off");_dNextRoll()};
 const nm=info.skill?SK_LBL[info.skill]:"运气";
 el.innerHTML=`<div class="dt-name">🎲 ${nm}判定 · DC${info.dc}</div>
  <div class="dt-die" id="dtDie">?</div>
  <div class="dt-sub">成功率 ${info.odds.pct}%（需骰 ≥${info.odds.need}）</div>`;
 _dSpin=setInterval(()=>{const e=$("dtDie");if(e)e.textContent=ri(1,20)},70);
 _dT.push(setTimeout(()=>{if(_dSpin){clearInterval(_dSpin);_dSpin=null}
  el.innerHTML=`<div class="dt-name">🎲 ${nm}判定 · DC${info.dc}</div>
   <div class="dt-die dt-set">${info.r}</div>
   <div class="dt-math">${info.reroll?`<span class="dt-sub">幸运重掷：1 → ${info.reroll} · </span>`:""}骰 ${info.r} ${sgn(info.mods)} = <b>${info.total}</b> vs DC${info.dc}</div>
   <div class="dt-verdict ${DT_CLS[info.out]}">${OUT_NAME[info.out]}</div>
   <div class="dt-parts">${info.parts.length?info.parts.map(p=>p.n+sgn(p.v)).join(" · "):"无修正"}</div>`},750));
 _dT.push(setTimeout(()=>{el.classList.add("off");_dNextRoll()},3100))}

function floaty(txt,cls,anchorId){
 try{
  const host=document.createElement("div");
  host.className="floaty "+(cls||"gold");
  host.textContent=txt;
  let x=innerWidth/2,y=90;
  if(anchorId){const el=document.querySelector(anchorId);
   if(el){const r=el.getBoundingClientRect();x=r.left+r.width/2;y=r.top-4}}
  host.style.left=Math.round(x)+"px";host.style.top=Math.round(y)+"px";
  host.style.transform="translateX(-50%)";
  document.body.appendChild(host);
  setTimeout(()=>host.remove(),1800)}catch(e){}}
function flashChip(sel){
 try{const el=document.querySelector(sel);
  if(el){el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}}catch(e){}}
function resFloat(res){
 if(!res)return;
 if(res.gold>0){floaty("💰+"+res.gold,"gold",".chip:not(.mainRes) b")}
 if(res.gold<0){floaty("💰"+res.gold,"hp",".chip:not(.mainRes) b")}
 if(res.main>0){floaty(LINES[S.line].icon+"+"+res.main,"infl",".chip.mainRes b")}
 if(res.main<0){floaty(LINES[S.line].icon+res.main,"hp",".chip.mainRes b")}
 if(res.hp<0){floaty("❤"+res.hp,"hp",".bar.hp")}
 if(res.hp>0){floaty("❤+"+res.hp,"infl",".bar.hp")}
 if(res.gold)flashChip(".chip:not(.mainRes)");
 if(res.main)flashChip(".chip.mainRes")}
function applyResult(res){if(!res)return;resFloat(res);
 if(res.gold){S.gold=Math.max(0,S.gold+res.gold)}
 if(res.main){S.infl=Math.max(0,S.infl+res.main)}
 if(res.hp){let h=res.hp;if(h<0&&S.comps.includes("moelle"))h+=1;S.hp=clamp(S.hp+h,0,S.hpMax)}
 if(res.order)S.order=clamp(S.order+res.order,-100,100);
 if(res.chaos)S.order=clamp(S.order-res.chaos,-100,100);
 if(res.good)S.good=clamp(S.good+res.good,-100,100);
 if(res.evil)S.good=clamp(S.good-res.evil,-100,100);
 if(res.morale&&S.domain)S.domain.morale=clamp(S.domain.morale+res.morale,0,100);
 if(res.pop&&S.domain)S.domain.pop+=res.pop;
 if(res.unlock)setFlag(res.unlock);
 if(res.unlockPick){for(const f of res.unlockPick){if(!S.flags[f]){setFlag(f);break}}}
 if(res.flag){if(typeof res.flag==="string")setFlag(res.flag);else for(const k in res.flag)S.flags[k]=res.flag[k]}
 if(res.loot&&!S.gear.includes(res.loot)){S.gear.push(res.loot);log("🎁 获得："+GEAR[res.loot].name,"epic")}
 if(res.asset&&!S.assets.includes(res.asset)){S.assets.push(res.asset)}
 if(res.rmAsset)S.assets=S.assets.filter(a=>a!==res.rmAsset);
 if(res.comp&&!S.comps.includes(res.comp)){S.comps.push(res.comp);log("🤝 "+COMP[res.comp].name+" 加入了你。","epic")}
 if(res.bond)S.bonds+=res.bond;
 if(res.milcap)S.milcap+=res.milcap;
 if(res.milPct&&S.army)for(const u in S.army){S.army[u]=Math.max(0,Math.floor(S.army[u]*(100+res.milPct)/100))}
 if(res.timer)S.timers.push({days:res.timer.days,fx:res.timer.fx||{},unflag:res.flag||null});
 if(res.log)log(res.log,(res.main>0||res.gold>0)?"good":((res.hp&&res.hp<0)?"bad":""))}

/* ================= 事件调度 ================= */
function needOk(k){switch(k){
 case"guild":return!!S.org;case"domain":return!!S.domain;case"army":return!!S.army;
 case"bank":return S.assets.includes("bank");
 case"workshop":return S.assets.includes("forge")||S.assets.includes("apothecary");
 case"mine":return nodeUnlocked("mine")&&S.stage>=1;default:return true}}
function canShow(e){
 if(e.line!=="shared"&&e.line!==S.line)return false;
 if(e.minStage>S.stage)return false;
 if(e.once&&S.evDone[e.id])return false;
 if(S.day-(S.evCd[e.id]||-999)<(e.cd||20))return false;
 if(e.need&&!needOk(e.need))return false;
 return true}
function maybeEvent(){
 if(S.day<S.nextEvDay||S.pending.length>=2)return;
 let pool=EVENTS.filter(e=>canShow(e)&&!S.pending.some(p=>p.id===e.id));
 const wild=ALIGN[S.align].mod==="wild";
 if(pool.length){
  let tot=0;for(const e of pool)tot+=e.w*(wild?1.2:1);
  let x=rng()*tot,ev=pool[0];
  for(const e of pool){x-=e.w*(wild?1.2:1);if(x<=0){ev=e;break}}
  S.evCd[ev.id]=S.day;S.pending.push({id:ev.id,dl:7});
  log("📜 新的事件："+ev.name)}
 S.nextEvDay=S.day+3+ri(0,5)}
function monthlyEvent(){const pool=EVENTS.filter(e=>e.monthly&&canShow(e)&&!S.pending.some(p=>p.id===e.id));
 if(pool.length&&rng()<0.4){const ev=choice(pool);S.evCd[ev.id]=S.day;S.pending.push({id:ev.id,dl:7});log("📜 风云事件："+ev.name)}}
function autoResolve(id){const ev=EVENTS.find(e=>e.id===id);if(!ev)return;
 let i=(ev.auto!=null&&ev.auto<ev.opts.length)?ev.auto:0;
 const o=ev.opts[i];log("⏳ 你迟迟未决，时间替你做了选择："+ev.name,"bad");
 S.evDone[id]=true;
 if(o.base)applyResult(o.base);
 else if(o.res)applyResult(o.res.fail||o.res.critfail||{})}

/* ================= 主动行动 ================= */
function actionSlots(){return 1+(S.stage>=1?2:0)+(S.stage>=2?2:0)}
function startAction(key){const d=ACTIONS[key];
 if(d.line&&d.line!==S.line)return;
 if(d.stage&&S.stage<d.stage)return;
 if(S.actions.length>=actionSlots()){log("⚠ 行动队列已满。");return}
 if(S.actions.some(a=>a.key===key)){log("⚠ 同一行动已在进行。");return}
 if(d.cost&&S.gold<d.cost){log("💰 金币不足。");return}
 let days=d.days;
 const c=CLASSES[S.cls];if(c.fast)days=Math.ceil(days*(1-c.fast));
 if(S.gear.includes("mount"))days=Math.ceil(days*0.9);
 if(d.cost)S.gold-=d.cost;
 S.actions.push({key,node:d.node,left:days,total:days});
 log("▶ 开始行动："+d.name+"（约"+days+"日）");
 save();renderAll()}
function resolveAction(a){const d=ACTIONS[a.key];
 S.flags.first_resolved=true;
 if(d.special){specialAction(d);return}

 else{log("⁉️ "+(S.line==="throne"?"战役":"商战")+"受挫，"+n.name+"暂不可得。","bad");
  if(S.line==="throne"&&S.army&&c.my<c.myStart){const f=c.my/Math.max(1,c.myStart);
   for(const u in S.army)S.army[u]=Math.floor(S.army[u]*f);
   applyResult({main:-30,log:"残部归营。损失被记在了你的名下。"})}
  else if(S.line==="gold"){const back=Math.round(c.invest*Math.max(0,c.my)/c.myStart*0.8);
   applyResult({gold:back,main:-15,log:"撤资离场。抢回本金"+back+"金币，声誉小损。"})}}
 S.contest=null;save()}

/* ================= 垄断(黄金线) ================= */
function monopState(){const st={iron:[],herb:[],crystal:[]};
 for(const c in st)for(const n in S.monop)if(S.monop[n]===c)st[c].push(n);
 return st}
function buyOrigin(node){for(const c in COMMODITIES){const price=COMMODITIES[c].origins[node];
 if(price==null||S.monop[node])continue;
 if(S.gold<price){log("💰 金币不足。","bad");return}
 S.gold-=price;S.monop[node]=c;
 const ms=monopState()[c];
 log("📦 收入一条"+COMMODITIES[c].name+"供应链（"+ms.length+"/2）","good");
 if(ms.length>=2){if(S.monopolized)S.monopolized[c]=true;
  log("🏦 垄断达成："+COMMODITIES[c].name+"！定价权在你手里。","epic");banner("🏦 垄断："+COMMODITIES[c].name)}
 save();renderAll();return}}

/* ================= 国债 ================= */
function buyBonds(){const price=Math.round(S.flags.prince_debt?16000:20000);
 if(S.gold<price){log("💰 金币不足。","bad");return}
 S.gold-=price;S.bonds+=20000;applyResult({main:10,order:3,log:"📜 又一批盖着御玺的债券入库。国王的债，是最好的债。"});
 if(S.bonds>=100000)checkEndings();save();renderAll()}

 uncrowned:{n:"无冕富王",t:"国王的库房要看你的脸色，尽管你从没有为自己加冕。黄金的王座，原本就不需要王冠。"},
 monopolist:{n:"垄断者",t:"粮食、药草、魔晶——价格表上每一行都由你落笔。这比王冠更沉，也更好用。"},
 creditor:{n:"债主之王",t:"国王在你面前也要脱帽。因为你持有他的国库，和他打过的每一场仗。"},

function checkEndings(){if(S.ended)return;
 if(S.hp<=0){end("fallen");return}
 if(S.line==="throne"){
  if(S.flags.dragon_slayer){end("slayer");return}
  if(S.stage>=5){
   if(S.good>=30&&S.domain&&S.domain.morale>=70&&S.infl>=6000){end("wise");return}
   if(S.good<=-30&&milPow()>=400){end("tyrant");return}}}
 else{
  if(S.gold>=500000){end("uncrowned");return}
  const monoCount=S.monopolized?["iron","herb","crystal"].filter(k=>S.monopolized[k]).length:0;
  if(monoCount>=2){end("monopolist");return}
  if(S.bonds>=100000){end("creditor");return}}
 if(S.day>=365&&S.stage<3)end(S.line==="throne"?"obscure_t":"obscure_g")}
function end(id){S.ended=id;S.paused=true;
 log("🏁 "+ENDINGS[id].n,"epic");renderEnding();save()}

 else if(S.tut===1&&S.actions.length>0)S.tut=2;
 else if(S.tut===2&&S.flags.first_resolved){S.tut=99;
  modal(`<h2>🎓 出师了！</h2>
    <div class="bigsteps">
    <div class="st"><span class="ic">📜</span><span><b>事件卡</b> = 抉择<br><span class="d">地图 = 行动 · 左栏 = 经营</span></span></div>

    </div>
    <button class="goldbtn" onclick="closeModal()">开始生涯</button>`)}}
function skipTut(){if(S){S.tut=99;closeModal();renderAll()}}

 if(!S||S.tut>=99||S.ended||CREATING){bar.style.display="none";return}

 bar.style.display="flex";
 bar.innerHTML=`<span>📍 新手指引 ${S.tut+1}/${TUT.length}：${step.t}</span>
  <button onclick="skipTut()">跳过指引</button>`}

function resSummary(res){if(!res)return"";const p=[];
 if(res.gold)p.push((res.gold>0?"+":"")+res.gold+"GP");
 if(res.main)p.push("+"+res.main+LINES[S.line].mainName);
 if(res.flag||res.unlock)p.push("★");
 return p.join(" ")}
/* 选项彩色标签：消耗红 / 判定橙 / 收益绿 / 风险深红 */
function optMeta(o){
 const m=[];
 if(o.cost)m.push(`<span class="tag-bad">-${o.cost}GP</span>`);
 if(o.dc!=null){const od=rollOdds(o.skill,o.dc,null);
  const bd=o.skill?skillBreakdown(o.skill).map(p=>p.n+sgn(p.v)).join("、"):"";
  const tip=`修正 ${sgn(od.mods)}：${bd||"无"}&#10;需骰≥${od.need} · 成功率${od.pct}%&#10;骰20或≥${od.critAt}＝大成功`;
  m.push(`<span class="tag-dc" title="${tip}">🎲DC${o.dc}${o.skill?"·"+SK_LBL[o.skill]+sgn(skillBonus(o.skill)):""} · ${od.pct}%</span>`)}
 const src=o.res?o.res.success:o.base;
 const g=resSummary(src);
 if(g)m.push(`<span class="tag-ok">✓ ${g}</span>`);
 const crit=o.res&&o.res.crit?resSummary(o.res.crit):"";
 if(crit)m.push(`<span class="tag-ok">✦ ${crit}</span>`);
 if(o.res&&o.res.critfail){
  const cf=o.res.critfail;
  if(cf.hp<=-6)m.push(`<span class="tag-bad">☠ 死亡风险</span>`);
  else if(cf.hp<0)m.push(`<span class="tag-bad">⚠ 受伤</span>`)}
 return m.join("")}
function openEvent(id){const ev=EVENTS.find(e=>e.id===id);if(!ev)return;
 let opts="";
 ev.opts.forEach((o,i)=>{
  opts+=`<button class="opt" onclick="chooseOpt('${id}',${i})">${esc(o.label)}
   <span class="meta">${optMeta(o)}</span></button>`});
 const dl=S.pending.find(p=>p.id===id);
 modal(`<h2>📜 ${ev.name}</h2><div class="story">${ev.text}</div>${opts}
  <hr><button onclick="closeModal()">稍后再说（剩${dl?dl.dl:0}日）</button>`)}
function chooseOpt(id,i){const ev=EVENTS.find(e=>e.id===id);const o=ev.opts[i];
 if(o.cost&&S.gold<o.cost){log("💰 金币不足，这个选项暂不可行。","bad");return}
 if(o.cost)S.gold-=o.cost;
 if(o.res){const out=rollCheck(o.skill,o.dc);applyResult(o.res[out]||{})}
 else applyResult(o.base||{});
 S.evDone[id]=true;S.pending=S.pending.filter(p=>p.id!==id);
 closeModal();save();renderAll()}

function nodeGlobe(id){const n=NODES[id];
 if(!nodeUnlocked(id)){modal(`<h2>❓ 未知的迷雾</h2><div class="story">关于这里，你还没有任何可靠的传闻。</div><button onclick="closeModal()">离开</button>`);return}
 let h=`<h2>${n.icon} ${n.name}</h2><div class="story">${n.desc}${S.occupied[id]?"<br>🏴 这里已在你的掌控之下。":""}</div>`;
 if(S.contest&&S.contest.target===id)h+=`<div class="small">⚔ 战事进行中（每日一掷，见左栏）。</div>`;
 const acts=Object.keys(ACTIONS).filter(k=>{const d=ACTIONS[k];
  if(d.node!==id)return false;
  if(d.line&&d.line!==S.line)return false;
  if(d.stage&&S.stage<d.stage)return false;
  if(k==="delve"&&!S.comps.length)return false;
  if(k==="dragon_slay"&&!dragonReady())return false;
  if(k==="dragon_deal"&&!dragonReady())return false;
  return true});
 if(acts.length){h+="<hr>";
  for(const k of acts){const d=ACTIONS[k];
   const full=S.actions.length>=actionSlots();
   const dup=S.actions.some(a=>a.key===k);
   const poor=d.cost&&S.gold<d.cost;
   const m=[];
   m.push(`<span class="tag-dc">⏱${d.days}日</span>`);
   if(d.skill||d.dc!=null){
    const extra=tradegear(d)+(d.key==="dragon"&&S.flags.dragon_slayers?-3:0);
    const od=rollOdds(d.skill,d.dc,extra);
    const bd=d.skill?skillBreakdown(d.skill).map(p=>p.n+sgn(p.v)).join("、"):"";
    const tip=`修正 ${sgn(od.mods)}：${[bd,extra?"形势"+sgn(extra):""].filter(x=>x).join("、")||"无"}&#10;需骰≥${od.need} · 成功率${od.pct}%&#10;骰20或≥${od.critAt}＝大成功`;
    if(d.skill)m.push(`<span class="tag-dc" title="${tip}">🎲DC${d.dc}·${SK_LBL[d.skill]}${sgn(skillBonus(d.skill)+extra)} · ${od.pct}%</span>`);
    else m.push(`<span class="tag-dc" title="${tip}">🎲DC${d.dc} · ${od.pct}%</span>`)}
   if(d.cost)m.push(`<span class="tag-bad">-${d.cost}GP</span>`);
   const g=resSummary(d.res?d.res.success:null);
   if(g)m.push(`<span class="tag-ok">✓ ${g}</span>`);
   if(d.desc.includes("☠"))m.push(`<span class="tag-bad">☠ 死亡风险</span>`);
   else if(d.desc.includes("⚠"))m.push(`<span class="tag-bad">⚠ 受伤可能</span>`);
   h+=`<button class="opt" ${full||dup||poor?"disabled":""} onclick="startAction('${k}');closeModal()">${d.name}
    <span class="meta">${m.join("")}</span></button>`}}
 if(["oak","gray","silver","academy","port"].includes(id))
  h+=`<button class="opt" onclick="openShop('${id}')">🛒 进入市场<span class="meta">装备、道具</span></button>`;
 if(S.line==="gold"&&S.stage>=4&&(id in COMMODITIES.iron.origins||id in COMMODITIES.herb.origins||id in COMMODITIES.crystal.origins)){
  for(const c in COMMODITIES){const price=COMMODITIES[c].origins[id];
   if(price==null||S.monop[id])continue;
   h+=`<button class="opt" ${S.gold<price?"disabled":""} onclick="buyOrigin('${id}')">📦 收购${COMMODITIES[c].name}供应链（${fmt(price)}GP）<span class="meta">供应链2/2即垄断该商品</span></button>`}}
 if(S.line==="throne"&&S.stage>=4&&id==="north"){h+="<hr><div class='small'>就地征募：</div>";
  for(const u in UNITS){const un=UNITS[u];
   h+=`<button class="opt" ${S.gold<un.price||milPow()+un.pow>milCap()?"disabled":""} onclick="buyUnit('${u}')">${un.icon}征募${un.name}<span class="meta">${un.price}GP · ${un.pow}军力 · ${un.maint}GP/日</span></button>`}}
 if(S.line==="gold"&&id==="silver"&&S.stage>=5)
  h+=`<button class="opt" ${S.gold<(S.flags.prince_debt?16000:20000)?"disabled":""} onclick="buyBonds()">📜 认购国债<span class="meta">持有100,000GP国债可达成「债主之王」结局</span></button>`;
 if(contestTargets().includes(id))
  h+=`<button class="opt goldbtn" onclick="openVote('${id}')">${S.line==="throne"?"⚔ 发起讨伐战役":"💼 发起商战收购"}<span class="meta">多日对抗 · 每日掷骰 · 可随时撤退</span></button>`;
 if(id==="black")
  h+=`<button class="opt" ${S.gold<100?"disabled":""} onclick="blackDeal()">🏴‍☠️ 买赃货（-100GP）<span class="meta">随机装备或一场空</span></button>`;
 h+="<hr><button onclick='closeModal()'>离开</button>";
 modal(h)}

 <hr><button onclick="closeModal()">关闭</button>`)}
function exportSave(){modal(`<h2>📤 存档文本</h2><textarea style="width:100%;height:200px;background:#1a1512;color:#e8dcc0;border:1px solid #5a4426">${JSON.stringify(S)}</textarea><button onclick="openHelp()">返回</button>`)}
function importSave(){modal(`<h2>📥 粘贴存档</h2><textarea id="impT" style="width:100%;height:200px;background:#1a1512;color:#e8dcc0;border:1px solid #5a4426"></textarea>
 <button onclick="doImport()">导入并重载</button><button onclick="openHelp()">返回</button>`)}
function doImport(){try{const s=JSON.parse($("impT").value);if(!s.line)throw 0;
 localStorage.setItem(SAVE_KEY,JSON.stringify(s));
 S=null;location.reload()}catch(e){alert("存档文本无法解析")}}
function offlineReport(days){const net=Math.max(0,(assetIncome()+contractIncome()+rentIncome()+tributeIncome()-wages()));
 const ir=mainRate();
 modal(`<h2>🌙 你离开了 ${days} 日</h2><div class="story">世界照常运转。你的产业、契约与人心替你赚了：</div>
  <div class="endstats"><span class="chip">💰 +${fmt(net*0.5*days)} GP（半速）</span>
  <span class="chip">${LINES[S.line].icon} +${fmt(ir*0.5*days)} ${LINES[S.line].mainName}</span></div>
  <div class="small">（离线收益上限7日，效率50%）</div><hr><button onclick="closeModal()">回到现实</button>`)}

/* ================= 开局向导 ================= */
const _cw={step:1,race:"human",cls:"mercenary",align:"ln",line:"throne",name:""};
function renderCreate(){
 let h=`<div class="wiz"><h1>王座与黄金</h1><div class="sub">DnD 放置经营 DEMO · 一局一线 · v0.4</div>`;
 if(_cw.step===1){h+=`<h2>① 选择种族</h2><div class="pick">`;
  for(const k in RACES){const r=RACES[k];
   h+=`<div class="p ${_cw.race===k?"sel":""}" onclick="_cw.race='${k}';renderCreate()">${r.icon}<b>${r.name}</b><div class="d">${r.desc}</div></div>`}
  h+=`</div><div class="wizbtns"><span></span><button class="goldbtn" onclick="_cw.step=2;renderCreate()">下一步 →</button></div>`}
 if(_cw.step===2){h+=`<h2>② 选择职业</h2><div class="pick">`;
  for(const k in CLASSES){const c=CLASSES[k];
   const rec=c.line==="both"?"双线皆宜":(c.line==="throne"?"王座":"黄金")+"线推荐";
   h+=`<div class="p ${_cw.cls===k?"sel":""}" onclick="_cw.cls='${k}';renderCreate()">${c.icon}<b>${c.name}</b> <span class="small">${rec}</span><div class="d">${c.desc}</div></div>`}
  h+=`</div><div class="wizbtns"><button onclick="_cw.step=1;renderCreate()">← 上一步</button><button class="goldbtn" onclick="_cw.step=3;renderCreate()">下一步 →</button></div>`}
 if(_cw.step===3){h+=`<h2>③ 选择阵营（会随决策漂移）</h2><div class="pick">`;
  for(const k in ALIGN){const a=ALIGN[k];
   h+=`<div class="p ${_cw.align===k?"sel":""}" onclick="_cw.align='${k}';renderCreate()"><b>${a.name}</b><div class="d">${a.desc}</div></div>`}
  h+=`</div><div class="wizbtns"><button onclick="_cw.step=2;renderCreate()">← 上一步</button><button class="goldbtn" onclick="_cw.step=4;renderCreate()">下一步 →</button></div>`}
 if(_cw.step===4){h+=`<h2>④ 选择这一局的人生主线（锁定，不可更改）</h2><div class="pick">`;
  for(const k in LINES){const l=LINES[k];
   const reqs=STAGE_REQ[k];let ladder="";
   for(let i=1;i<=5;i++)ladder+=`<span class="tag">${l.stages[i]}</span>`;
   h+=`<div class="p ${_cw.line===k?"sel":""}" onclick="_cw.line='${k}';renderCreate()">${l.icon}<b>${l.name}线</b><div class="d">${l.hint}</div><div>${ladder}</div></div>`}
  h+=`</div><h2>⑤ 名字</h2><input type="text" id="nameI" value="${esc(_cw.name)}" placeholder="你的名字" oninput="_cw.name=this.value">
  <div class="small" style="margin-top:8px">人生没有存档点可以回头的部分，这里也一样。</div>
  <div class="wizbtns"><button onclick="_cw.step=3;renderCreate()">← 上一步</button>
  <button class="goldbtn" onclick="beginGame()">⚔ 开始人生</button></div>`}
 h+="</div>";
 $("create").innerHTML=h}

/* ================= 开局与主循环 ================= */
const OPEN_LINES={
 mercenary:"佣兵工会的登记员抬起眼皮：'又一个想赚命的。去橡木村的地窖，鼠人又闹了。'",
 cleric:"修道院长的信还揣在怀里：'去橡木村，那里有人需要你。'",
 bard:"酒馆的老板娘说：'唱得好，酒钱算我的。橡木村，出发。'",
 ranger:"林线尽头传来狼嚎。你踏上通往橡木村的旧道。",
 merchant:"父亲把货车缰绳递给你：'橡木村、灰石镇……货卖到哪，路就在哪。'",
 smith:"你背起工具箱。灰石镇的炉火，总得有人接。",
 nightwalker:"你从当铺后窗溜出，袖里多了一张灰石镇的锁匠图。",
 alchemist:"蒸馏罐咕嘟作响。你把三瓶药剂塞进行囊，目标是橡木村。"};
function beginGame(){
 WIPING=false;
 _cw.name=($("nameI")?$("nameI").value:"")||_cw.name||"无名者";
 S=newState(_cw);rngSeed(S.seed);
 CREATING=false;$("create").classList.add("off");
 S.evCd.E001=S.day;S.pending.push({id:"E001",dl:7});
 log("🌅 "+(OPEN_LINES[S.cls]||"你的故事从橡木村开始。"),"epic");
 save();renderAll();
 /* 开局时间静止：读完引导、处理完第一个事件后再流动 */
 S.paused=true;renderTop();
 modal(`<h2>🌅 ${esc(S.name)}，你的人生开始了</h2>
  <div class="story">时间自己流动，你负责决策。</div>
  <div class="bigsteps">
  <div class="st"><span class="ic">🗺</span><span><b>点地图节点</b> → 发起行动<br><span class="d">数日后自动掷骰结算</span></span></div>
  <div class="st"><span class="ic">📜</span><span><b>点金色事件卡</b> → 做出抉择<br><span class="d">7日内必须处理</span></span></div>
  <div class="st"><span class="ic">📒</span><span><b>看左栏账本</b> → 买产业<br><span class="d">产业每天自动入账</span></span></div>
  </div>
  <div class="small" style="text-align:center">时间<b>暂停中</b>——处理完第一张事件卡，传奇开场。</div>
  <button class="goldbtn" style="width:100%;margin-top:8px" onclick="S._autoPause=null;S.paused=false;renderTop();closeModal()">开始 ▶</button>`)}
function tick(){
 S.day++;
 for(const a of S.actions){a.left--;if(a.left<=0)resolveAction(a)}
 S.actions=S.actions.filter(a=>a.left>0);
 if(S.contest)contestDay();
 dailyIncome();
 if(S.domain)domainTick();
 for(const p of S.pending)p.dl--;
 const exp=S.pending.filter(p=>p.dl<=0);
 if(exp.length){for(const p of exp)autoResolve(p.id);S.pending=S.pending.filter(p=>p.dl>0)}
 maybeEvent();
 for(const t of S.timers){t.days--;if(t.days<=0){applyResult(t.fx);if(t.unflag)delete S.flags[t.unflag]}}
 S.timers=S.timers.filter(t=>t.days>0);
 checkDebt();
 checkStage();
 if(S.day%30===0)monthly();
 checkEndings();
 if(S.day%10===0)save();
 tutCheck();
 if(!S.ended)renderAll()}
let _acc=0,_lastT=0;
setInterval(()=>{const now=Date.now();
 if(!S||CREATING||S.ended){_lastT=now;return}
 const tr=$("daytrack"),fi=$("dayprog"),lb=$("dplabel");
 if(tr&&fi){const pct=Math.min(100,_acc/3000*100);
  fi.style.width=pct+"%";
  const pa=!!S.paused;
  tr.classList.toggle("paused",pa);
  tr.title=pa?"时间暂停中":"当日进度（1日=3秒×速度）";
  if(lb)lb.textContent=pa?"暂停":""}
 if(S.paused){_lastT=now;return}
 if(!_lastT){_lastT=now;return}
 // 真实时差累计：标签页被浏览器后台节流/休眠后，唤醒时按实际流逝时间补算放置收益
 let add=(now-_lastT)*S.speed;
 if(add>540000)add=540000; // 单次唤醒最多补180天，避免长时间后台一次性卡死页面
 _acc+=add;_lastT=now;
 while(_acc>=3000){_acc-=3000;if(!S.ended)tick()}
 },100);
setInterval(()=>save(),20000);
window.addEventListener("beforeunload",()=>save());

/* ================= 启动 ================= */
(function boot(){
 WIPING=false;
 const sv=loadSave();
 if(sv){
  /* 存档净化：旧版本数值污染（NaN经JSON序列化会变成null）就地修复 */
  const num=(v,d)=>(typeof v==="number"&&isFinite(v))?v:d;
  sv.gold=num(sv.gold,20);sv.infl=num(sv.infl,0);sv.hp=num(sv.hp,num(sv.hpMax,10));
  if(sv.domain){sv.domain.pop=num(sv.domain.pop,2000);sv.domain.tax=isFinite(sv.domain.tax)?sv.domain.tax:0.12;
   sv.domain.morale=num(sv.domain.morale,55)}
  if(sv.org)sv.org.members=num(sv.org.members,10);
  if(sv.army)for(const u in sv.army)sv.army[u]=num(sv.army[u],0);
  if(!isFinite(sv.day)||sv.day<1)sv.day=1;
  if(!isFinite(sv.speed))sv.speed=1}
 if(sv){S=sv;rngSeed(S.seed||1);
  S.speed=S.speed||1;S.flags=S.flags||{};S.monop=S.monop||{};S.timers=S.timers||[];
  if(S.tut==null)S.tut=99;
  const off=Math.floor((Date.now()-(S.lastReal||Date.now()))/3000);
  if(off>=1){const d=Math.min(7,off);
   const net=Math.max(0,(assetIncome()+contractIncome()+rentIncome()+tributeIncome()-wages()))*0.5*d;
   const ir=mainRate()*0.5*d;S.gold+=net;S.infl+=ir;S.day+=d;S.lastReal=Date.now();save();
   setTimeout(()=>offlineReport(d),300)}
  renderAll();
  log("📖 你回来了。日志还在，世界也还在。")}
 else{CREATING=true;$("create").classList.remove("off");renderCreate()}
})();

</script>
